# Заголовки безопасности для vozmimenya.ru.
# Подключается в server и в каждом location с собственным add_header:
# nginx не наследует add_header из server, если в location есть свой.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Сначала только отчёт: нарушения видны в консоли браузера, сайт не ломается.
# После проверки Метрики, виджетов Яндекс Карт и PDF договора переименовать в Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.vozmimenya.ru https://mc.yandex.ru https://mc.yandex.com https://*.yandex.ru https://*.yandex.net; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https://api.vozmimenya.ru https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru https://cdnjs.cloudflare.com; frame-src https://yandex.ru https://*.yandex.ru https://mc.yandex.ru https://mc.yandex.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://webvisor.com https://*.webvisor.com https://metrika.yandex.ru" always;
