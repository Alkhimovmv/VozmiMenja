# vozmimenya.ru — статический фронтенд (client/dist) на Cloud.ru вместо GitHub Pages.
# Файлы кладёт deploy-local.sh update в /var/www/html/vozmimenya.ru.
# Отдача повторяет GitHub Pages: /route -> route.html или route/index.html, неизвестный путь -> 404.html
# (в нём SPA-редирект для клиентских маршрутов), плюс заголовки безопасности и долгий кеш ассетов.
#
# Установка (один раз):
#   sudo cp nginx/snippets/vozmimenya-security-headers.conf /etc/nginx/snippets/
#   sudo cp nginx/vozmimenya-site.conf /etc/nginx/sites-available/vozmimenya-site.conf
#   sudo ln -s /etc/nginx/sites-available/vozmimenya-site.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS, www -> без www, одним хопом.
server {
    listen 80;
    listen [::]:80;
    server_name vozmimenya.ru www.vozmimenya.ru;

    # Проверка домена certbot (HTTP-01) должна проходить до редиректа.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vozmimenya.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vozmimenya.ru;

    ssl_certificate /etc/letsencrypt/live/vozmimenya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vozmimenya.ru/privkey.pem;

    return 301 https://vozmimenya.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vozmimenya.ru;

    ssl_certificate /etc/letsencrypt/live/vozmimenya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vozmimenya.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vozmimenya_ssl:10m;
    ssl_session_timeout 1d;

    root /var/www/html/vozmimenya.ru;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/vozmimenya-security-headers.conf;

    # Как GitHub Pages: неизвестный путь -> 404.html со статусом 404 (SPA-скрипт внутри перенаправит клиентский маршрут).
    error_page 404 /404.html;

    # /index.html и хвостовой слэш -> канонический адрес (на Pages они отдавали 200-дубли).
    location = /index.html {
        return 301 /;
    }
    rewrite ^/(.+)/$ /$1 permanent;

    # HTML: всегда перепроверять у сервера, чтобы новая сборка была видна сразу.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }

    # Сборка Vite кладёт ассеты с хешем в имени: их можно кешировать навсегда.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }

    # Картинки и иконки без хеша в имени: месяц, затем перепроверка.
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }

    # Файлы для поисковиков и AI-агентов меняются с каждой сборкой.
    location ~* ^/(?:robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|ai-summary\.json|ai-prices\.json|site\.webmanifest|manifest\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }
}
