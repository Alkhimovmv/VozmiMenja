# vozmimenya.ru — SSR-фронтенд с автоматическим статическим fallback на Cloud.ru.
# Файлы кладёт deploy-local.sh update в /var/www/html/vozmimenya.ru.
# Публичный HTML рендерит Node на loopback:3004, а /admin и ассеты Nginx отдаёт статически.
# Если SSR недоступен, /route -> route.html или route/index.html; неизвестный путь сохраняет 404.
#
# Установка (один раз):
#   sudo cp nginx/snippets/vozmimenya-security-headers.conf /etc/nginx/snippets/
#   sudo cp nginx/vozmimenya-site.conf /etc/nginx/sites-available/vozmimenya-site.conf
#   sudo ln -s /etc/nginx/sites-available/vozmimenya-site.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

proxy_cache_path /var/cache/nginx/vozmimenya-ssr
    levels=1:2
    keys_zone=vozmimenya_ssr:10m
    max_size=256m
    inactive=10m
    use_temp_path=off;

upstream vozmimenya_ssr {
    server 127.0.0.1:3004;
    keepalive 16;
}

map $uri $ssr_cache_bypass {
    default 0;
    ~^/booking(?:/success)?$ 1;
}

# HTTP -> HTTPS, www -> без www, одним хопом.
server {
    listen 80;
    listen [::]:80;
    server_name vozmimenya.ru www.vozmimenya.ru;

    # Проверка домена certbot (HTTP-01) должна проходить до редиректа.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vozmimenya.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vozmimenya.ru;

    ssl_certificate /etc/letsencrypt/live/vozmimenya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vozmimenya.ru/privkey.pem;

    return 301 https://vozmimenya.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vozmimenya.ru;

    ssl_certificate /etc/letsencrypt/live/vozmimenya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vozmimenya.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vozmimenya_ssl:10m;
    ssl_session_timeout 1d;

    root /var/www/html/vozmimenya.ru;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/vozmimenya-security-headers.conf;

    # Как GitHub Pages: неизвестный путь -> 404.html со статусом 404 (SPA-скрипт внутри перенаправит клиентский маршрут).
    error_page 404 /404.html;

    # /index.html и хвостовой слэш -> канонический адрес (на Pages они отдавали 200-дубли).
    location = /index.html {
        return 301 /;
    }
    rewrite ^/(.+)/$ /$1 permanent;

    # Старые публичные URL: настоящие 301 вместо HTML meta refresh.
    # Query string сохраняется для UTM и диагностических параметров.
    location = /arenda-kamery-dlya-puteshestviya-vloga-moskva {
        return 301 /arenda-gopro-moskva$is_args$args;
    }

    location = /blog/kak-vybrat-pylesos-dlya-uborki-posle-remonta {
        return 301 /blog/kak-ubrat-stroitelnuyu-pyl-posle-remonta$is_args$args;
    }

    location = /equipment {
        return 301 /$is_args$args;
    }

    # Админка остаётся отдельным SPA и никогда не проходит через SSR.
    location ^~ /admin {
        try_files $uri $uri.html $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }

    # Публичный HTML: SSR с минутным microcache. Параметры аналитики не дробят кеш.
    location / {
        proxy_pass http://vozmimenya_ssr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache vozmimenya_ssr;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$uri";
        proxy_cache_valid 200 60s;
        proxy_cache_bypass $ssr_cache_bypass;
        proxy_no_cache $ssr_cache_bypass;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        add_header X-SSR-Cache $upstream_cache_status always;

        proxy_intercept_errors on;
        error_page 502 503 504 = @static_fallback;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }

    # Отказоустойчивость: используем сохранённые статические route entrypoints.
    # =404 не превращает неизвестные URL в ложные страницы со статусом 200.
    location @static_fallback {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-SSR-Fallback "static" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }

    # Сборка Vite кладёт ассеты с хешем в имени: их можно кешировать навсегда.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }

    # Картинки и иконки без хеша в имени: месяц, затем перепроверка.
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }

    # Файлы для поисковиков и AI-агентов меняются с каждой сборкой.
    location ~* ^/(?:robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|ai-summary\.json|ai-prices\.json|site\.webmanifest|manifest\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/vozmimenya-security-headers.conf;
    }
}
