name: Uptime

# Внешний мониторинг vozmimenya.ru: сайт, API, каталог, бронь, sitemap и SSL раз в сутки (06:00 МСК).
# Уведомление во VK только при смене состояния: «упало» и «восстановилось».
# Нужны секреты репозитория MONITOR_VK_TOKEN и MONITOR_VK_PEER_ID (те же VK_BOT_TOKEN и VK_PEER_ID,
# что у уведомлений о заявках на сервере). Без них падение всё равно видно как упавший запуск —
# GitHub присылает письмо владельцу репозитория.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout monitoring script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/monitoring
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run checks
        id: checks
        continue-on-error: true
        run: node scripts/monitoring/uptime-check.mjs

      - name: Previous state
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Последний завершённый запуск этого workflow (текущий ещё выполняется).
          conclusion=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/uptime.yml/runs?status=completed&per_page=1" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).workflow_runs[0];console.log(r?r.conclusion:'none')})" || echo none)
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "Предыдущий запуск: $conclusion"

      - name: Notify VK
        env:
          VK_TOKEN: ${{ secrets.MONITOR_VK_TOKEN }}
          VK_PEER_ID: ${{ secrets.MONITOR_VK_PEER_ID }}
          OUTCOME: ${{ steps.checks.outcome }}
          PREVIOUS: ${{ steps.previous.outputs.conclusion }}
          PROBLEMS: ${{ steps.checks.outputs.problems }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$VK_TOKEN" ] || [ -z "$VK_PEER_ID" ]; then
            echo "Секреты VK не заданы — уведомление пропущено (письмо от GitHub придёт при упавшем запуске)"
            exit 0
          fi
          if [ "$OUTCOME" = "failure" ] && [ "$PREVIOUS" != "failure" ]; then
            text=$(printf '🔴 vozmimenya.ru: проблема\n\n%s\n\n%s' "$PROBLEMS" "$RUN_URL")
          elif [ "$OUTCOME" = "success" ] && [ "$PREVIOUS" = "failure" ]; then
            text=$(printf '🟢 vozmimenya.ru: всё снова работает\n\n%s' "$RUN_URL")
          else
            echo "Состояние не изменилось ($PREVIOUS → $OUTCOME) — без уведомления"
            exit 0
          fi
          # VK API отвечает HTTP 200 и при ошибке, поэтому проверяем поле error в ответе.
          response=$(curl -sS -X POST "https://api.vk.com/method/messages.send" \
            --data-urlencode "access_token=${VK_TOKEN}" \
            --data-urlencode "peer_id=${VK_PEER_ID}" \
            --data-urlencode "random_id=$(date +%s%N | cut -c1-15)" \
            --data-urlencode "message=${text}" \
            --data-urlencode "dont_parse_links=1" \
            --data-urlencode "v=5.199")
          if echo "$response" | grep -q '"error"'; then
            echo "VK вернул ошибку: $(echo "$response" | sed 's/"access_token":"[^"]*"//')"
            exit 1
          fi
          echo "Уведомление во VK отправлено"

      - name: Fail run when checks failed
        if: steps.checks.outcome == 'failure'
        run: exit 1
