name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история нужна для реальных lastmod в sitemap.xml
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Wait for seeded articles in production API
        run: node scripts/wait-for-seeded-articles.mjs --timeout-ms 900000 --interval-ms 15000

      - name: Install dependencies
        run: cd client && npm ci

      - name: Create production env file
        working-directory: ./client
        run: echo "VITE_API_URL=https://api.vozmimenya.ru/api" > .env.production

      - name: Build
        working-directory: ./client
        run: npm run build

      # Сравниваем новый sitemap с ещё опубликованным: эти URL после деплоя уйдут в IndexNow.
      - name: Collect changed URLs for IndexNow
        run: node scripts/indexnow-submit.mjs diff --new client/dist/sitemap.xml --old-url https://vozmimenya.ru/sitemap.xml --out indexnow-urls.txt

      - name: Keep IndexNow URL list
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.txt
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify seeded article release
        run: node scripts/smoke-seeded-articles.mjs --attempts 12 --interval-ms 10000

  # Яндекс и Bing (Copilot) узнают об изменённых страницах сразу, а не при следующем обходе.
  # Сбой отправки не откатывает и не помечает деплой упавшим.
  indexnow:
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download IndexNow URL list
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls

      - name: Submit changed URLs to IndexNow
        run: node scripts/indexnow-submit.mjs submit --file indexnow-urls.txt --key-file client/public/62993ccc1ac672e0d223b701894ea14b.txt
