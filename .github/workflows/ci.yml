name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Server typecheck
        run: npm run typecheck --workspace=server

      - name: Server tests
        run: npm test --workspace=server

      - name: Server lint
        run: npm run lint --workspace=server

      - name: Client typecheck
        working-directory: ./client
        run: npx tsc -b

      - name: Client tests
        run: npm test --workspace=client

      - name: Client lint
        run: npm run lint --workspace=client

      - name: Release script tests
        run: npm run test:article-release && npm run test:indexnow && npm run test:search-console && npm run test:nginx-site
